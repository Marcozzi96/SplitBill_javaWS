spring:
  datasource:
    url: jdbc:h2:file:./data/splitbill
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      # update (non create-drop): con H2 su file i dati devono sopravvivere ai riavvii
      ddl-auto: update
    show-sql: true
  mail:
    host: localhost
    port: 25
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: ${JWT_SECRET:}
  validity: ${JWT_VALIDITY:86400}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
